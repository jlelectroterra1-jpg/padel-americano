name: Supabase keep-alive

# Supabase free-tier projects auto-pause after about a week with no API
# activity, which breaks the live score sync. This pings the project
# twice a week so it never goes idle long enough to pause.

on:
  schedule:
    - cron: "0 6 * * 1,4"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -sf "https://zoizkgrjpeetwxltjhqy.supabase.co/rest/v1/tournaments?select=id&limit=1" \
            -H "apikey: sb_publishable_O-I3Yg9ZFuVR5hzMl2bGcA_PV3w3ftj" \
            -H "Authorization: Bearer sb_publishable_O-I3Yg9ZFuVR5hzMl2bGcA_PV3w3ftj"
