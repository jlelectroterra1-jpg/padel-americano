name: Deploy to GitHub Pages

# Explicit deploy workflow, replacing reliance on GitHub's own
# auto-injected Pages workflow (which stopped triggering on push for
# this repo and needed the whole Pages site rebuilt to investigate).
# The concurrency group here also fixes the root cause of an earlier
# issue where two near-simultaneous deploys locked each other out -
# this queues them instead of erroring.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - id: deployment
        uses: actions/deploy-pages@v4
